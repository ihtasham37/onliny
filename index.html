    <script>
      // Dynamic manifest and branding early detection from URL & cache before React renders
      (function() {
        try {
          var fullPath = window.location.pathname + window.location.hash;
          var searchParams = new URLSearchParams(window.location.search || '');
          var vendorMatch = fullPath.match(/(?:\/store\/v\/|\/vendor-store\/)([^/?#]+)/);
          var vendorId = (vendorMatch && vendorMatch[1]) ? decodeURIComponent(vendorMatch[1]) : (searchParams.get('vendor') || searchParams.get('v'));
          var catMatch = fullPath.match(/(?:\/store\/c\/|\/standalone\/)([^/?#]+)/);
          var catId = (catMatch && catMatch[1]) ? decodeURIComponent(catMatch[1]) : (searchParams.get('category') || searchParams.get('cat') || searchParams.get('store'));
          
          var manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) {
            if (vendorId) {
              manifestLink.setAttribute('href', '/manifest.json?vendor=' + encodeURIComponent(vendorId));
            } else if (catId) {
              manifestLink.setAttribute('href', '/manifest.json?category=' + encodeURIComponent(catId));
            }
          }

          // Apply saved logo/branding from cached settings
          var brandCache = localStorage.getItem('pwa_brand_cache');
          var logoUrl = '';
          var appName = '';
          if (brandCache) {
            try {
              var parsedBrand = JSON.parse(brandCache);
              if (parsedBrand.logoUrl) logoUrl = parsedBrand.logoUrl;
              if (parsedBrand.appName) appName = parsedBrand.appName;
            } catch(e) {}
          }
          if (!logoUrl) {
            var localCatalog = localStorage.getItem('onliny_catalog_local_cache');
            if (localCatalog) {
              try {
                var parsedCat = JSON.parse(localCatalog);
                if (parsedCat && parsedCat.data && parsedCat.data.settings) {
                  if (parsedCat.data.settings.logoUrl) logoUrl = parsedCat.data.settings.logoUrl;
                  if (parsedCat.data.settings.appName) appName = parsedCat.data.settings.appName;
                }
              } catch(e) {}
            }
          }

          if (logoUrl) {
            var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleIcon) appleIcon.setAttribute('href', logoUrl);
            var favicons = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"]');
            favicons.forEach(function(el) {
              el.setAttribute('href', logoUrl);
            });

            // If not vendor/category specific, generate dynamic manifest blob
            if (!vendorId && !catId && window.Blob && window.URL && manifestLink) {
              var title = appName || 'onliny';
              var short = title.length > 12 ? title.slice(0, 12).trim() : title;
              var dynamicManifest = {
                id: '/',
                name: title,
                short_name: short,
                start_url: '/',
                scope: '/',
                display: 'standalone',
                orientation: 'portrait',
                background_color: '#ffffff',
                theme_color: '#be185d',
                description: 'Official ' + title + ' storefront with verified products and fast delivery.',
                prefer_related_applications: false,
                categories: ['shopping', 'lifestyle'],
                icons: [
                  { src: logoUrl, sizes: '192x192 512x512', type: 'image/png', purpose: 'any' },
                  { src: logoUrl, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
                ]
              };
              var blob = new Blob([JSON.stringify(dynamicManifest)], { type: 'application/manifest+json' });
              manifestLink.setAttribute('href', URL.createObjectURL(blob));
            }
          }
        } catch(e) {}
      })();

      // Register Service Worker immediately for instant PWA installation recognition by Chrome
      if ('serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
            reg.update().catch(function() {});
          }).catch(function(err) {
            console.warn('PWA ServiceWorker registration:', err);
          });
        } catch(e) {}
      }

      // Intercept PWA install prompt early before React components mount
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPWAInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
      });
    </script>
